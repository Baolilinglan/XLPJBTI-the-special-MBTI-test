<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狼BTI - 你的血狼人格鉴定</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="questions.js"></script>

<style>
    @media (pointer: fine) {
        * { cursor: none !important; }
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        background-color: #effeff;
        background-image: 
            radial-gradient(circle at 15% 30%, rgba(212, 175, 55, 0.12), transparent 40%),
            radial-gradient(circle at 85% 70%, rgba(31, 30, 51, 0.08), transparent 40%),
            repeating-linear-gradient(45deg, rgba(31, 30, 51, 0.02) 0px, rgba(31, 30, 51, 0.02) 1px, transparent 1px, transparent 20px),
            repeating-linear-gradient(-45deg, rgba(212, 175, 55, 0.03) 0px, rgba(212, 175, 55, 0.03) 1px, transparent 1px, transparent 20px);
        color: #1f1e33;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        transition: background-image 0.5s ease-out;
    }

    body.glitch-active {
        animation: glitch-anim 0.2s linear infinite;
    }
    body.heavy-glitch {
        animation: glitch-anim 0.1s linear infinite;
        filter: contrast(1.1) saturate(1.2);
    }
    @keyframes glitch-anim {
        0% { filter: hue-rotate(0deg) blur(0px); transform: translate(0, 0) skew(0deg); }
        20% { filter: hue-rotate(15deg) blur(1px); transform: translate(-2px, 1px) skew(-1deg); }
        40% { filter: hue-rotate(-15deg) blur(0px); transform: translate(2px, -1px) skew(1deg); }
        60% { filter: hue-rotate(30deg) blur(2px); transform: translate(-1px, 2px) skew(-2deg); }
        80% { filter: hue-rotate(-30deg) blur(1px); transform: translate(1px, -2px) skew(2deg); }
        100% { filter: hue-rotate(0deg) blur(0px); transform: translate(0, 0) skew(0deg); }
    }

    #floating-texts {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
    }
    .floating-text {
        position: absolute;
        bottom: -50px;
        color: rgba(100, 116, 139, 0.8);
        white-space: nowrap;
        font-family: 'Helvetica Neue', 'SimHei', sans-serif;
        font-weight: 600;
        letter-spacing: 2px;
        animation: float-up-text linear forwards;
    }
    @keyframes float-up-text {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateY(-110vh); opacity: 0; }
    }

    #custom-cursor {
        position: fixed;
        top: -50px; left: -50px;
        width: 18px; height: 18px;
        border: 1px solid rgba(212, 175, 55, 0.8);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 10000;
        display: flex; justify-content: center; align-items: center;
        transition: width 0.2s, height 0.2s, background 0.2s, border-color 0.2s;
    }
    #custom-cursor::after {
        content: '';
        width: 4px; height: 4px;
        background: #1f1e33;
        border-radius: 50%;
        transition: transform 0.2s;
    }
    #custom-cursor.cursor-hover {
        width: 32px; height: 32px;
        background: rgba(212, 175, 55, 0.1);
        border-color: rgba(31, 30, 51, 0.4);
    }
    #custom-cursor.cursor-hover::after {
        transform: scale(0);
    }
    @media (hover: none) and (pointer: coarse) {
        #custom-cursor { display: none !important; }
    }

    #trail-canvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 9998;
    }
    #fireworks-canvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 9999;
    }

    #wbti-watermark {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 25vw; font-weight: 900;
        color: rgba(31, 30, 51, 0.02);
        z-index: 0; pointer-events: none; user-select: none;
        letter-spacing: -1vw;
        animation: float 8s ease-in-out infinite;
    }

    #music-toggle {
        position: fixed;
        top: 20px; right: 20px;
        width: 40px; height: 40px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(212, 175, 55, 0.6);
        border-radius: 50%;
        z-index: 10001;
        display: flex; justify-content: center; align-items: center;
        font-size: 12px; font-weight: bold; color: #1f1e33;
        backdrop-filter: blur(4px);
    }

    .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(212, 175, 55, 0.4);
        border-radius: 12px;
        padding: 40px;
        width: 85%; max-width: 600px;
        box-shadow: 0 30px 60px -15px rgba(31, 30, 51, 0.15);
        text-align: center;
        position: relative; z-index: 10;
        max-height: 90vh; overflow-y: auto;
    }
    .glass-panel::-webkit-scrollbar { width: 6px; }
    .glass-panel::-webkit-scrollbar-thumb { background: rgba(31, 30, 51, 0.1); border-radius: 3px; }
    .hidden { display: none !important; }

    .disclaimer-box {
        font-size: 12px; color: #475569; line-height: 1.6;
        text-align: left; padding: 15px; background: rgba(31, 30, 51, 0.03);
        border: 1px solid rgba(31, 30, 51, 0.1); border-radius: 8px;
        margin-bottom: 25px;
    }

    #user-id-input {
        width: 80%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid rgba(31, 30, 51, 0.3);
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        outline: none;
        transition: border-color 0.2s;
    }
    #user-id-input:focus {
        border-color: #d4af37;
    }

    .share-info-block {
        background: rgba(248, 250, 252, 0.9);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        text-align: left;
        border: 1px solid rgba(31, 30, 51, 0.08);
        transition: all 0.3s;
    }
    .share-info-row {
        font-size: 15px;
        color: inherit;
        margin-bottom: 8px;
        font-weight: 500;
    }
    .share-info-danger {
        letter-spacing: 2px;
    }

    .micro-en {
        font-size: 10px; color: #64748b; letter-spacing: 1px;
        text-transform: uppercase; font-family: monospace;
        margin-top: 4px; display: block;
    }

    #main-title { font-size: 44px; font-weight: 600; margin-bottom: 16px; color: #1f1e33; letter-spacing: 2px; }
    #sub-title { font-size: 15px; color: #475569; line-height: 1.6; margin-bottom: 20px; }

    .progress-bar-container {
        width: 100%; height: 2px;
        background: rgba(31, 30, 51, 0.1);
        border-radius: 1px; margin-bottom: 25px; overflow: hidden;
    }
    .progress-bar {
        height: 100%; width: 0%;
        background: #d4af37;
        transition: width 0.3s ease;
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .typing-cursor {
        display: inline-block; width: 8px; height: 16px;
        background-color: #1f1e33; vertical-align: middle;
        margin-left: 4px; animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .header-group { margin-bottom: 30px; text-align: left; }
    #question-text { font-size: 16px; line-height: 1.6; margin: 0; font-weight: 500; min-height: 56px; color: #1f1e33; }

    .option-btn {
        display: block; width: 100%;
        padding: 14px 18px; margin: 8px 0;
        background: #ffffff;
        border: 1px solid rgba(31, 30, 51, 0.15);
        border-radius: 8px; color: #334155;
        font-size: 14px; transition: background 0.2s, border-color 0.2s, color 0.2s;
        text-align: left;
        cursor: pointer;
    }
    .option-btn:hover {
        background: rgba(212, 175, 55, 0.05);
        border-color: rgba(212, 175, 55, 0.6); color: #1f1e33;
    }

    .action-bar {
        display: flex;
        justify-content: flex-start;
        margin-top: 15px;
    }
    #back-btn {
        background: transparent;
        border: 1px solid rgba(31, 30, 51, 0.3);
        border-radius: 6px;
        color: #475569;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
    }
    #back-btn:hover {
        background: rgba(31, 30, 51, 0.05);
        color: #1f1e33;
    }

    #processing-log {
        font-family: monospace; font-size: 14px;
        color: #475569; text-align: left; line-height: 2; margin-top: 20px;
    }

    #result-title { display: none; }
    #result-desc { font-size: 14px; color: inherit; margin-bottom: 20px; line-height: 1.8; text-align: left; white-space: pre-wrap; transition: color 0.3s; }
    
    #radar-container {
        width: 100%; max-width: 350px; margin: 0 auto 20px;
    }

    #start-btn, #resume-btn, #save-btn, #restart-btn {
        display: inline-block; width: auto;
        padding: 12px 32px; background: #ffffff; 
        border: 1px solid #d4af37; border-radius: 20px;
        color: #1f1e33; font-size: 15px; font-weight: 500;
        transition: all 0.2s; margin-top: 10px; text-align: center;
        cursor: pointer;
    }
    #start-btn:hover, #resume-btn:hover, #save-btn:hover, #restart-btn:hover {
        background: #d4af37; color: #ffffff;
    }

    .action-group {
        display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap;
    }

    .qr-footer {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 30px; padding-top: 20px;
        border-top: 1px solid rgba(31, 30, 51, 0.1);
        text-align: left;
    }
    .qr-text { font-size: 12px; color: inherit; line-height: 1.5; opacity: 0.8; }
    .qr-image { width: 64px; height: 64px; border-radius: 4px; border: 1px solid rgba(31, 30, 51, 0.1); }

    .achievement-badge {
        display: inline-block; background: rgba(212, 175, 55, 0.15);
        color: #b8860b; font-size: 12px; padding: 4px 8px;
        border-radius: 4px; border: 1px solid rgba(212, 175, 55, 0.4);
        margin: 4px 4px 4px 0; font-weight: bold;
    }

    .screenshot-controls {
        font-size: 12px; color: #64748b; margin-top: 15px; display: flex;
        justify-content: center; gap: 10px; align-items: center;
    }
    .screenshot-controls label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
</style>
</head>
<body>

<div id="wbti-watermark">WOLF BTI</div>
<div id="floating-texts"></div>

<canvas id="trail-canvas"></canvas>
<canvas id="fireworks-canvas"></canvas>

<div id="custom-cursor"></div>

<audio id="bgm-player" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<button id="music-toggle" class="hover-target">BGM</button>

<div class="glass-panel" id="start-container">
    <h1 id="main-title">狼BTI</h1>
    <div id="sub-title">记录你在相关社区的行为特征</div>
    
    <input type="text" id="user-id-input" class="hover-target" placeholder="输入识别代号 (选填)" maxlength="16" autocomplete="off">

    <div class="disclaimer-box">
        免责声明：本应用“狼BTI”仅用于行为模式测定。测试题目、选项及结局是对特定社区现象的总结。本测试不具备心理学参考价值。请理性看待结果。
    </div>

    <span class="micro-en" style="margin-bottom: 20px;">SYSTEM INITIALIZATION COMPLETE</span>
    <div class="action-group" style="margin-top: 0;">
        <button id="start-btn" class="hover-target">开始鉴定</button>
        <button id="resume-btn" class="hidden hover-target">恢复上次进度</button>
    </div>
</div>

<div class="glass-panel hidden" id="quiz-container">
    <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="quiz-content">
        <div class="header-group">
            <h2 id="question-text"></h2>
            <span class="micro-en" id="question-micro">AWAITING INPUT...</span>
        </div>
        <div id="options-container" class="hidden"></div>
        <div class="action-bar hidden" id="quiz-action-bar">
            <button id="back-btn" class="hover-target">← 上一题</button>
        </div>
    </div>
</div>

<div class="glass-panel hidden" id="processing-container">
    <div style="font-size: 14px; color: #1f1e33; letter-spacing: 1px; font-weight: bold;">PROCESSING DATA</div>
    <span class="micro-en">EXTRACTING PARAMETERS</span>
    <div id="processing-log"></div>
</div>

<div class="glass-panel hidden" id="result-container">
    <div style="font-size: 12px; color: #64748b; margin-bottom: 4px; letter-spacing: 1px;">ASSESSMENT COMPLETED</div>
    <span class="micro-en" style="margin-bottom: 20px;">FINAL PROFILE GENERATED</span>
    
    <div class="share-info-block" id="share-info-block">
        <div class="share-info-row" id="out-user-id" style="display: none;"></div>
        <div class="share-info-row" id="out-title"></div>
        <div class="share-info-row" id="out-purity"></div>
        <div class="share-info-row share-info-danger" id="out-danger"></div>
        
        <div id="achievements-container" style="margin-top: 8px;"></div>
        
        <div id="out-divider" style="height: 1px; background: rgba(31,30,51,0.1); margin: 15px 0;"></div>
        
        <div class="share-info-row" id="out-same-percent"></div>
        <div class="share-info-row" id="out-leaderboard" style="margin-top: 10px; font-size: 13.5px; opacity: 0.8; font-weight: normal; line-height: 1.6;">
            <div id="out-most"></div>
            <div id="out-rarest"></div>
        </div>
        
        <div class="share-info-row" id="out-path-insight" style="margin-top: 15px; font-size: 13.5px; background: rgba(31, 30, 51, 0.05); padding: 12px; border-radius: 6px; border-left: 3px solid #d4af37;"></div>
    </div>

    <div id="radar-container" class="hidden">
        <canvas id="radarChart"></canvas>
    </div>

    <div id="result-desc"></div>
    
    <div class="qr-footer" id="qr-footer">
        <div class="qr-text">保存或截图记录结果<br>扫描右侧二维码测试你的狼BTI</div>
        <img class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://baolilinglan.github.io/XLPJBTI-the-special-MBTI-test/" crossorigin="anonymous" alt="QR Code">
    </div>

    <div class="screenshot-controls" id="screenshot-controls">
        <label><input type="checkbox" id="chk-dark-mode"> 深色模式</label>
        <label><input type="checkbox" id="chk-hide-radar"> 隐藏雷达</label>
        <label><input type="checkbox" id="chk-hide-path"> 隐藏路径记录</label>
    </div>

    <div class="action-group">
        <button id="save-btn" class="hidden hover-target">导出记录</button>
        <button id="restart-btn" class="hidden hover-target">重新测定</button>
    </div>
</div>

<script>
    let activeQuestions = [];
    let currentQuestionIndex = 0;
    let scoreHistory = [];
    let userPath = []; 
    let scoreDim1 = 0, scoreDim2 = 0, scoreDim3 = 0, scoreDim4 = 0;
    let noneCount = 0;
    let typeWriterInterval = null;
    let isTyping = false;
    let isMusicPlaying = false;
    let fireworkAnimId = null;
    let myRadarChart = null;
    let currentThemeColor = '#d4af37';
    let currentThemeParticles = ['#d4af37', '#1f1e33', '#475569', '#cbd5e1'];
    let themeLocked = false;
    let userId = "";
    let themeGlitchTimeout = null;

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let envColor1 = 'rgba(212, 175, 55, 0.12)'; 
    let envColor2 = 'rgba(31, 30, 51, 0.08)'; 
    
    const customCursor = document.getElementById('custom-cursor');
    const trailCanvas = document.getElementById('trail-canvas');
    const tCtx = trailCanvas.getContext('2d');
    let trails = [];

    const startContainer = document.getElementById("start-container");
    const quizContainer = document.getElementById("quiz-container");
    const processingContainer = document.getElementById("processing-container");
    const resultContainer = document.getElementById("result-container");
    const questionTextElement = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const progressBar = document.getElementById("progress-bar");
    const saveBtn = document.getElementById("save-btn");
    const startBtn = document.getElementById("start-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const restartBtn = document.getElementById("restart-btn");
    const backBtn = document.getElementById("back-btn");
    const quizActionBar = document.getElementById("quiz-action-bar");
    const processingLog = document.getElementById("processing-log");
    const radarContainer = document.getElementById("radar-container");
    const bgmPlayer = document.getElementById('bgm-player');
    const musicToggle = document.getElementById('music-toggle');
    const userIdInput = document.getElementById("user-id-input");

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration, vol=0.05) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    if (localStorage.getItem('wbti_progress_v2')) {
        resumeBtn.classList.remove('hidden');
    }

    const baikeFragments = ["中杯", "超大杯", "毒攻略", "新神已至", "大杯偏上", "合约登顶", "你什么冠军", "枪枪爆头", "为用而用", "会赢的", "Work Work", "我既是天选，也是唯一", "血狼破军", "七分裤", "设计师", "攻速+7"];
    
    musicToggle.addEventListener('click', () => {
        if (isMusicPlaying) {
            bgmPlayer.pause();
            musicToggle.style.opacity = '0.5';
        } else {
            bgmPlayer.play().catch(e => console.log("BGM挂起:", e));
            musicToggle.style.opacity = '1';
        }
        isMusicPlaying = !isMusicPlaying;
    });

    function spawnFloatingText() {
        const container = document.getElementById('floating-texts');
        if (!container) return;
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = baikeFragments[Math.floor(Math.random() * baikeFragments.length)];
        el.style.left = (Math.random() * 90) + 'vw';
        el.style.animationDuration = (Math.random() * 15 + 15) + 's';
        el.style.fontSize = (Math.random() * 12 + 14) + 'px';
        container.appendChild(el);
        setTimeout(() => el.remove(), 30000);
    }
    setInterval(spawnFloatingText, 3000);

    function resizeCanvas() {
        trailCanvas.width = window.innerWidth;
        trailCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        customCursor.style.left = mouseX + 'px';
        customCursor.style.top = mouseY + 'px';

        if(window.matchMedia("(pointer: fine)").matches) {
            trails.push({ x: mouseX, y: mouseY, life: 1, char: Math.random() > 0.5 ? '1' : '0' });
        }

        if(!themeLocked) {
            const xPercent = (mouseX / window.innerWidth) * 100;
            const yPercent = (mouseY / window.innerHeight) * 100;
            document.body.style.backgroundImage = `
                radial-gradient(circle at ${xPercent}% ${yPercent}%, ${envColor1}, transparent 40%),
                radial-gradient(circle at ${100 - xPercent}% ${100 - yPercent}%, ${envColor2}, transparent 40%),
                repeating-linear-gradient(45deg, rgba(31, 30, 51, 0.02) 0px, rgba(31, 30, 51, 0.02) 1px, transparent 1px, transparent 20px),
                repeating-linear-gradient(-45deg, rgba(212, 175, 55, 0.03) 0px, rgba(212, 175, 55, 0.03) 1px, transparent 1px, transparent 20px)
            `;
        }
    });

    function animateTrail() {
        tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
        tCtx.font = "12px monospace";
        for (let i = trails.length - 1; i >= 0; i--) {
            let p = trails[i];
            p.life -= 0.04; p.y += 0.5; 
            tCtx.fillStyle = themeLocked ? currentThemeColor : `rgba(212, 175, 55, ${p.life * 0.5})`;
            if(themeLocked && p.life > 0) {
                tCtx.globalAlpha = p.life * 0.5;
            }
            tCtx.fillText(p.char, p.x, p.y);
            tCtx.globalAlpha = 1;
            if (p.life <= 0) trails.splice(i, 1);
        }
        requestAnimationFrame(animateTrail);
    }
    animateTrail();

    function updateEnvironmentLight() {
        if (themeLocked) return;
        let limit = currentQuestionIndex || 1;
        let r1_ratio = Math.max(-1, Math.min(1, scoreDim1 / limit));
        let r2_ratio = Math.max(-1, Math.min(1, scoreDim2 / limit));
        
        let baseR1 = 212 + (r1_ratio * 20);
        let baseG1 = 175 + (r2_ratio * 20);
        let baseB1 = 55 + (Math.abs(r1_ratio) * 20);
        
        let baseR2 = 31 - (r1_ratio * 10);
        let baseG2 = 30 + (Math.abs(r2_ratio) * 10);
        let baseB2 = 51 + (r2_ratio * 10);

        envColor1 = `rgba(${Math.floor(baseR1)}, ${Math.floor(baseG1)}, ${Math.floor(baseB1)}, 0.15)`;
        envColor2 = `rgba(${Math.floor(baseR2)}, ${Math.floor(baseG2)}, ${Math.floor(baseB2)}, 0.1)`;
    }

    function bindCursorHover() {
        document.querySelectorAll('.hover-target, .option-btn, #music-toggle, input').forEach(el => {
            el.addEventListener('mouseenter', () => customCursor.classList.add('cursor-hover'));
            el.addEventListener('mouseleave', () => customCursor.classList.remove('cursor-hover'));
        });
    }
    bindCursorHover();

    function initGameSession() {
        userId = userIdInput.value.trim();
        // 这里依赖于外部文件 questions.js 中的 rawQuestions
        activeQuestions = [...rawQuestions].sort(() => 0.5 - Math.random()).slice(0, 20);
        currentQuestionIndex = 0;
        scoreDim1 = 0; scoreDim2 = 0; scoreDim3 = 0; scoreDim4 = 0;
        noneCount = 0;
        scoreHistory = [];
        userPath = []; 
        progressBar.style.width = "0%";
        themeLocked = false;
        document.body.classList.remove('heavy-glitch', 'glitch-active');
        if(themeGlitchTimeout) clearTimeout(themeGlitchTimeout);
        currentThemeColor = '#d4af37';
        updateEnvironmentLight();
        if (myRadarChart) {
            myRadarChart.destroy();
            myRadarChart = null;
        }
        clearProgress();
    }

    function saveProgress() {
        const data = {
            activeQuestions, currentQuestionIndex, scoreDim1, scoreDim2, scoreDim3, scoreDim4, noneCount, userPath, scoreHistory
        };
        localStorage.setItem('wbti_progress_v2', JSON.stringify(data));
    }

    function clearProgress() {
        localStorage.removeItem('wbti_progress_v2');
    }

    resumeBtn.addEventListener('click', () => {
        const savedData = JSON.parse(localStorage.getItem('wbti_progress_v2'));
        if(savedData) {
            if (!isMusicPlaying) {
                bgmPlayer.play().catch(e => console.log("BGM挂起:", e));
                isMusicPlaying = true; musicToggle.style.opacity = '1';
            }
            activeQuestions = savedData.activeQuestions;
            currentQuestionIndex = savedData.currentQuestionIndex;
            scoreDim1 = savedData.scoreDim1;
            scoreDim2 = savedData.scoreDim2;
            scoreDim3 = savedData.scoreDim3;
            scoreDim4 = savedData.scoreDim4 || 0;
            noneCount = savedData.noneCount;
            userPath = savedData.userPath;
            scoreHistory = savedData.scoreHistory;
            
            customCursor.classList.remove('cursor-hover');
            startContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            updateEnvironmentLight();
            loadQuestion();
        }
    });

    startBtn.addEventListener('click', () => {
        playTone(500, 'sine', 0.1);
        if (!isMusicPlaying) {
            bgmPlayer.play().then(() => {
                isMusicPlaying = true;
                musicToggle.style.opacity = '1';
            }).catch(e => console.log("BGM挂起:", e));
        }
        initGameSession();
        customCursor.classList.remove('cursor-hover');
        startContainer.classList.add('hidden');
        quizContainer.classList.remove('hidden');
        loadQuestion();
    });

    restartBtn.addEventListener('click', () => {
        playTone(400, 'square', 0.1);
        if (fireworkAnimId) cancelAnimationFrame(fireworkAnimId);
        const fCanvas = document.getElementById('fireworks-canvas');
        fCanvas.getContext('2d').clearRect(0, 0, fCanvas.width, fCanvas.height);
        
        document.getElementById("share-info-block").style.display = "none";
        document.getElementById("achievements-container").innerHTML = "";
        
        initGameSession();
        resultContainer.classList.add('hidden');
        resultContainer.classList.remove('fade-in');
        saveBtn.classList.add('hidden');
        restartBtn.classList.add('hidden');
        customCursor.classList.remove('cursor-hover');
        quizContainer.classList.remove('hidden');
        loadQuestion();
    });

    backBtn.addEventListener('click', () => {
        if (currentQuestionIndex > 0 && !isTyping) {
            playTone(300, 'triangle', 0.1);
            currentQuestionIndex--;
            const prevState = scoreHistory.pop();
            scoreDim1 = prevState.d1;
            scoreDim2 = prevState.d2;
            scoreDim3 = prevState.d3;
            scoreDim4 = prevState.d4 || 0;
            noneCount = prevState.nc;
            userPath.pop(); 
            updateEnvironmentLight();
            saveProgress();
            loadQuestion();
        }
    });

    function typeWriter(text, element, speed, callback) {
        clearInterval(typeWriterInterval);
        element.innerHTML = "";
        isTyping = true;
        let i = 0;
        const textSpan = document.createElement("span");
        const cursorSpan = document.createElement("span");
        cursorSpan.className = "typing-cursor";
        element.appendChild(textSpan);
        element.appendChild(cursorSpan);
        typeWriterInterval = setInterval(() => {
            if (i < text.length) {
                textSpan.innerHTML += text.charAt(i);
                i++;
            } else {
                clearInterval(typeWriterInterval);
                isTyping = false;
                if (callback) callback();
            }
        }, speed);
    }

    function loadQuestion() {
        const currentQuestion = activeQuestions[currentQuestionIndex];
        const progressPercent = (currentQuestionIndex / activeQuestions.length) * 100;
        progressBar.style.width = progressPercent + "%";
        optionsContainer.classList.add("hidden");
        quizActionBar.classList.add("hidden");
        optionsContainer.innerHTML = "";
        
        let shuffledOptions = [...currentQuestion.options];
        const noneOpt = shuffledOptions.pop();
        shuffledOptions.sort(() => 0.5 - Math.random());
        shuffledOptions.push(noneOpt);

        shuffledOptions.forEach(option => {
            const button = document.createElement("button");
            button.innerText = option.text;
            button.classList.add("option-btn");
            button.onclick = () => {
                if(!isTyping) {
                    playTone(600, 'sine', 0.05);
                    customCursor.classList.remove('cursor-hover');
                    selectOption(option.effect, option.text === "我都不想选");
                }
            };
            optionsContainer.appendChild(button);
        });
        
        document.getElementById("question-micro").innerText = `AWAITING INPUT... [SEQ: ${(currentQuestionIndex + 1).toString().padStart(2, '0')}]`;
        
        const renderText = `(${currentQuestionIndex + 1}/${activeQuestions.length}) ${currentQuestion.text}`;
        typeWriter(renderText, questionTextElement, 15, () => {
            optionsContainer.classList.remove("hidden");
            optionsContainer.classList.add("fade-in");
            if (currentQuestionIndex > 0) {
                quizActionBar.classList.remove("hidden");
                quizActionBar.classList.add("fade-in");
            }
            bindCursorHover(); 
        });
    }

    function selectOption(effect, isNone) {
        scoreHistory.push({ d1: scoreDim1, d2: scoreDim2, d3: scoreDim3, d4: scoreDim4, nc: noneCount });
        userPath.push({ qIndex: currentQuestionIndex, type: effect.typeStr });
        
        scoreDim1 += effect.d1;
        scoreDim2 += effect.d2;
        scoreDim3 += effect.d3;
        scoreDim4 += effect.d4 || 0;
        if (isNone) noneCount++;
        currentQuestionIndex++;
        updateEnvironmentLight();
        
        if (currentQuestionIndex < activeQuestions.length) {
            saveProgress();
            loadQuestion();
        } else {
            progressBar.style.width = "100%";
            clearProgress();
            setTimeout(showProcessing, 400); 
        }
    }

    function showProcessing() {
        document.body.classList.add("glitch-active"); 
        setTimeout(() => {
            document.body.classList.remove("glitch-active");
            quizContainer.classList.add("hidden");
            processingContainer.classList.remove("hidden");
            const logs = ["> 提取行为决策链...", "> 解析社区交互参数...", "> 验证四维状态量...", "> 比对成分数据...", "> 生成最终模型...", "> COMPLETED."];
            let logIndex = 0;
            processingLog.innerHTML = "";
            const logInterval = setInterval(() => {
                if (logIndex < logs.length) {
                    playTone(800 + logIndex*100, 'square', 0.05);
                    const p = document.createElement("div");
                    p.innerText = logs[logIndex];
                    p.classList.add("fade-in");
                    processingLog.appendChild(p);
                    logIndex++;
                } else {
                    clearInterval(logInterval);
                    setTimeout(() => {
                        processingContainer.classList.add("hidden");
                        showResult();
                    }, 600);
                }
            }, 500); 
        }, 200);
    }

    function drawRadarChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        const maxScore = activeQuestions.length;
        
        const userData = [
            Math.abs(scoreDim1 >= 0 ? scoreDim1 : 0), 
            Math.abs(scoreDim2 >= 0 ? scoreDim2 : 0), 
            Math.abs(scoreDim3 >= 0 ? scoreDim3 : 0), 
            Math.abs(scoreDim4 <= 0 ? scoreDim4 : 0), 
            Math.abs(scoreDim1 < 0 ? scoreDim1 : 0),  
            Math.abs(scoreDim2 < 0 ? scoreDim2 : 0),  
            Math.abs(scoreDim3 < 0 ? scoreDim3 : 0),
            Math.abs(scoreDim4 > 0 ? scoreDim4 : 0)
        ];

        const avgData = [
            Math.floor(Math.random() * 5 + 2), Math.floor(Math.random() * 5 + 2),
            Math.floor(Math.random() * 5 + 2), Math.floor(Math.random() * 5 + 2),
            Math.floor(Math.random() * 5 + 2), Math.floor(Math.random() * 5 + 2),
            Math.floor(Math.random() * 5 + 2), Math.floor(Math.random() * 5 + 2)
        ];

        myRadarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['强度关注', '乐子拱火', '核心黏性', '衍生创作', '佛系吃瓜', '逆向黑粉', '场外资本', '跨界对比'],
                datasets: [
                {
                    label: '测定倾向',
                    data: userData,
                    backgroundColor: 'rgba(212, 175, 55, 0.4)',
                    borderColor: 'rgba(212, 175, 55, 1)',
                    pointBackgroundColor: 'rgba(31, 30, 51, 1)',
                    pointBorderColor: '#ffffff',
                    borderWidth: 2,
                    order: 1
                },
                {
                    label: '大众基准',
                    data: avgData,
                    backgroundColor: 'rgba(100, 116, 139, 0.1)',
                    borderColor: 'rgba(100, 116, 139, 0.3)',
                    pointBackgroundColor: 'rgba(100, 116, 139, 0.5)',
                    pointRadius: 2,
                    borderWidth: 1,
                    borderDash: [5, 5],
                    order: 2
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: 'rgba(31, 30, 51, 0.1)' },
                        grid: { color: 'rgba(31, 30, 51, 0.1)' },
                        pointLabels: {
                            font: { size: 11, family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" },
                            color: '#1f1e33'
                        },
                        ticks: { display: false, min: 0, max: maxScore }
                    }
                },
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: {size: 10} } },
                    tooltip: { enabled: false }

        });

    function applyTheme(key) {
        themeLocked = true;
        document.body.classList.remove('heavy-glitch', 'glitch-active');
        if(themeGlitchTimeout) clearTimeout(themeGlitchTimeout);
        
        let needsGlitch = false;

        if (noneCount === activeQuestions.length) {
            envColor1 = 'rgba(10, 10, 15, 0.3)';
            envColor2 = 'rgba(0, 0, 0, 0.5)';
            currentThemeColor = '#475569';
            currentThemeParticles = ['#1f1e33', '#334155', '#0f172a'];
            needsGlitch = true;
        } else {
            if (key.includes("positive_positive_positive_negative")) {
                envColor1 = 'rgba(0, 120, 255, 0.15)'; envColor2 = 'rgba(0, 50, 150, 0.1)';
                currentThemeColor = '#0078ff'; currentThemeParticles = ['#0078ff', '#00d4ff', '#e0f2fe', '#0ea5e9'];
            } else if (key.includes("positive_positive_negative_negative") || key.includes("negative_negative_positive_negative")) {
                envColor1 = 'rgba(220, 20, 60, 0.18)'; envColor2 = 'rgba(100, 0, 0, 0.15)';
                currentThemeColor = '#dc143c'; currentThemeParticles = ['#dc143c', '#ff0000', '#8b0000', '#fecdd3']; needsGlitch = true;
            } else if (key.includes("negative_negative_negative_negative") || key.includes("negative_negative_positive_positive")) {
                envColor1 = 'rgba(255, 105, 180, 0.18)'; envColor2 = 'rgba(199, 21, 133, 0.1)';
                currentThemeColor = '#ff69b4'; currentThemeParticles = ['#ff69b4', '#ff1493', '#fbcfe8', '#db2777'];
            } else if (key.includes("positive_negative_positive_negative") || key.includes("negative_positive_negative_negative")) {
                envColor1 = 'rgba(240, 240, 240, 0.3)'; envColor2 = 'rgba(200, 200, 200, 0.2)';
                currentThemeColor = '#cbd5e1'; currentThemeParticles = ['#ffffff', '#f1f5f9', '#cbd5e1', '#94a3b8'];
            } else {
                envColor1 = 'rgba(212, 175, 55, 0.12)'; envColor2 = 'rgba(31, 30, 51, 0.08)';
                currentThemeColor = '#d4af37'; currentThemeParticles = ['#d4af37', '#1f1e33', '#475569', '#cbd5e1'];
            }
        }

        if (needsGlitch) {
            document.body.classList.add('heavy-glitch');
            themeGlitchTimeout = setTimeout(() => { document.body.classList.remove('heavy-glitch'); }, 1000);
        }

        const xPercent = (mouseX / window.innerWidth) * 100;
        const yPercent = (mouseY / window.innerHeight) * 100;
        document.body.style.backgroundImage = `
            radial-gradient(circle at ${xPercent}% ${yPercent}%, ${envColor1}, transparent 40%),
            radial-gradient(circle at ${100 - xPercent}% ${100 - yPercent}%, ${envColor2}, transparent 40%),
            repeating-linear-gradient(45deg, rgba(31, 30, 51, 0.02) 0px, rgba(31, 30, 51, 0.02) 1px, transparent 1px, transparent 20px),
            repeating-linear-gradient(-45deg, rgba(212, 175, 55, 0.03) 0px, rgba(212, 175, 55, 0.03) 1px, transparent 1px, transparent 20px)
        `;
    }

    function generatePathInsight() {
        if(noneCount === activeQuestions.length) return "未检测到有效选择。";
        let validPaths = userPath.filter(p => p.type !== "无动于衷");
        if(validPaths.length === 0) return "未记录到具备倾向性的行为特征。";

        for(let i = 0; i <= validPaths.length - 3; i++) {
            if(validPaths[i].type === validPaths[i+1].type && validPaths[i+1].type === validPaths[i+2].type) {
                return `测试阶段，连续呈现【${validPaths[i].type}】行为关联。`;
            }
        }
        
        let lastHalf = validPaths.slice(-Math.floor(validPaths.length / 2));
        if (lastHalf.length > 0) {
            let counts = {};
            lastHalf.forEach(p => { counts[p.type] = (counts[p.type] || 0) + 1; });
            let maxType = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
            if(counts[maxType] >= 3) {
                return `近期选择模型明显趋向【${maxType}】行为路径。`;
            }
        }
        return "行为特征呈散发状。";
    }

    function detectAchievements() {
        let achs = [];
        let currentStreak = 0; let lastType = "";
        userPath.forEach(p => {
            if(p.type === lastType && p.type !== "无动于衷") currentStreak++;
            else { currentStreak = 1; lastType = p.type; }
            if(currentStreak === 5) achs.push(`【连贯印记】连续执行${p.type}向选择`);
        });

        if(Math.abs(scoreDim1) >= 12) achs.push("【行为固化】某维度属性大幅溢出");
        if(Math.abs(scoreDim2) >= 12) achs.push("【情绪传导】交互偏好表现明显");
        if(noneCount >= 8 && noneCount < 15) achs.push("【隔离状态】规避了多数核心冲突议题");
        
        return [...new Set(achs)];
    }

    function showResult() {
        playTone(600, 'sine', 0.1); setTimeout(() => playTone(800, 'sine', 0.2), 150);
        resultContainer.classList.remove("hidden");
        resultContainer.classList.add("fade-in");
        
        let key = "";
        // 依赖于外部文件中的 outcomes
        key += (scoreDim1 >= 0) ? "positive_" : "negative_";
        key += (scoreDim2 >= 0) ? "positive_" : "negative_";
        key += (scoreDim3 >= 0) ? "positive_" : "negative_";
        key += (scoreDim4 >= 0) ? "positive" : "negative";
        
        applyTheme(key);
        const shareBlock = document.getElementById("share-info-block");

        if (noneCount === activeQuestions.length) {
            shareBlock.style.display = "block";
            document.getElementById("out-title").innerText = "判定失败：数据不足";
            document.getElementById("out-purity").style.display = "none";
            document.getElementById("out-danger").style.display = "none";
            document.getElementById("out-same-percent").style.display = "none";
            document.getElementById("out-leaderboard").style.display = "none";
            document.getElementById("out-divider").style.display = "none";
            document.getElementById("out-path-insight").style.display = "none";
            document.getElementById("achievements-container").innerHTML = "";
            document.getElementById("result-desc").innerText = "测试终止。";
            radarContainer.classList.add("hidden");
        } else {
            const finalOutcome = outcomes[key];
            const maxScoreSum = activeQuestions.length * 4;
            const currentScoreSum = Math.abs(scoreDim1) + Math.abs(scoreDim2) + Math.abs(scoreDim3) + Math.abs(scoreDim4);
            const purity = Math.min(100, Math.floor(60 + (currentScoreSum / maxScoreSum) * 40));

            shareBlock.style.display = "block";
            
            if (userId) {
                const idEl = document.getElementById("out-user-id");
                idEl.style.display = "block"; idEl.innerText = `记录代号：${userId}`;
            } else { document.getElementById("out-user-id").style.display = "none"; }
            
            document.getElementById("out-title").innerText = `归类结果：【${finalOutcome.title}】`;
            
            const purityEl = document.getElementById("out-purity");
            purityEl.style.display = "block"; purityEl.innerText = `特征纯度：${purity}%`;
            
            const dangerEl = document.getElementById("out-danger");
            dangerEl.style.display = "block"; dangerEl.innerText = `危险等级：${finalOutcome.danger}`;

            const achs = detectAchievements();
            const achContainer = document.getElementById("achievements-container");
            achContainer.innerHTML = "";
            achs.forEach(ach => {
                const span = document.createElement("span");
                span.className = "achievement-badge";
                span.innerText = ach;
                achContainer.appendChild(span);
            });

            document.getElementById("out-divider").style.display = "block";

            let myPercent = (5 + (Math.random() * 4 - 2)).toFixed(1);
            const samePercentEl = document.getElementById("out-same-percent");
            samePercentEl.style.display = "block"; samePercentEl.innerText = `相似特征占比：${myPercent}%`;

            const allKeys = Object.keys(outcomes);
            const allTitles = allKeys.map(k => outcomes[k].title);
            let mostIndex = Math.floor(Math.random() * allTitles.length);
            let rarestIndex = Math.floor(Math.random() * allTitles.length);
            while (rarestIndex === mostIndex) { rarestIndex = Math.floor(Math.random() * allTitles.length); }
            let mostPercent = (28 + Math.random() * 12).toFixed(1);
            let rarestPercent = (1 + Math.random() * 4).toFixed(1);
            
            const leaderboardEl = document.getElementById("out-leaderboard");
            leaderboardEl.style.display = "block";
            document.getElementById("out-most").innerText = `当前主流态：${allTitles[mostIndex]} (${mostPercent}%)`;
            document.getElementById("out-rarest").innerText = `游离态：${allTitles[rarestIndex]} (${rarestPercent}%)`;

            const pathInsightEl = document.getElementById("out-path-insight");
            pathInsightEl.style.display = "block";
            pathInsightEl.innerText = `记录：${generatePathInsight()}`;

            document.getElementById("result-desc").innerText = finalOutcome.desc;
            
            radarContainer.classList.remove("hidden");
            drawRadarChart();
        }

        startDataBurst();
        setTimeout(() => {
            saveBtn.classList.remove("hidden"); 
            restartBtn.classList.remove("hidden");
            bindCursorHover(); 
        }, 800);
    }

    function startDataBurst() {
        const fCanvas = document.getElementById('fireworks-canvas');
        const ctx = fCanvas.getContext('2d');
        fCanvas.width = window.innerWidth;
        fCanvas.height = window.innerHeight;
        const particles = [];
        
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.friction = 0.92; this.gravity = 0.05;
                this.alpha = 1; this.decay = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.vx *= this.friction; this.vy *= this.friction;
                this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha;
                ctx.beginPath(); ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
            }
        }
        function explode(x, y) {
            for (let i = 0; i < 40; i++) particles.push(new Particle(x, y, currentThemeParticles[Math.floor(Math.random() * currentThemeParticles.length)]));
        }
        function fAnimate() {
            fireworkAnimId = requestAnimationFrame(fAnimate);
            ctx.clearRect(0, 0, fCanvas.width, fCanvas.height);
            if (Math.random() < 0.02) explode(Math.random() * fCanvas.width, fCanvas.height * Math.random() * 0.5);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(); p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }
        explode(fCanvas.width / 2, fCanvas.height / 3);
        setTimeout(() => explode(fCanvas.width * 0.3, fCanvas.height * 0.4), 500);
        setTimeout(() => explode(fCanvas.width * 0.7, fCanvas.height * 0.4), 1000);
        fAnimate();
    }
